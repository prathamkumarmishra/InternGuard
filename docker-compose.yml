services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    env_file: ./ai-service/.env.example
    ports:
      - "8000:8000"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      - mongodb
      - ai-service
    env_file: ./backend/.env.example
    environment:
      MONGO_URI: mongodb://mongodb:27017/internguard
      AI_SERVICE_URL: http://ai-service:8000
      CPP_ENGINE_PATH: /app/risk-engine/build/risk_engine
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    ports:
      - "3000:3000"

volumes:
  mongo_data:
